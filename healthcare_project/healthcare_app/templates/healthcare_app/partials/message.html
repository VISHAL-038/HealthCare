<!-- healthcare_app/partials/message.html -->
<div class="message {% if message.sender == user %}sent{% else %}received{% endif %} {% if message.image %}has-image{% endif %}">
    <strong aria-label="Message from {{ message.sender.username }}">{{ message.sender.username }}</strong>:
    {% if message.content %}
      <p>{{ message.content|safe }}</p>
    {% endif %}
    {% if message.image %}
      <img src="{{ message.image.url }}" alt="Attached image from {{ message.sender.username }}" style="max-width: 100%; height: auto; margin-top: 5px;" onerror="this.src='/static/fallback-image.png'; this.alt='Image failed to load';" />
    {% endif %}
    <span class="timestamp">{{ message.timestamp|date:"H:i" }}</span>
  </div>
